name: Remote Health

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-health
  cancel-in-progress: true

jobs:
  validate:
    name: Catalog and mirrors
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate live manifest and mirror integrity
        env:
          MANIFEST_URL: https://data.headsdb.com/manifest.json
        run: .github/scripts/check-remote.py
